<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Redeemed Warrior Ad Studio — Faith-Fueled Advertising, Made in Minutes</title>
<meta name="theme-color" content="#2A0009" />
<meta name="description" content="Type in what you sell. Get professional ads in minutes — social captions, Google ads, video scripts, slogans and more. Built for women of faith building businesses." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --pink:#E2449A; --hot:#F05AA8; --pink-deep:#C22B7E;
  --gold:#D4AF6A; --gold-light:#EFD9B4;
  --night:#2A0009; --night-2:#4A0A24;
  --ivory:#FBF6EE; --cream:#F6EBDD; --blush:#F9E3EC;
  --ink:#2B1420; --muted:#8A6B7A;
  --ok:#1E9E6A; --err:#C0392B;
  --radius:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Jost',system-ui,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,.display{font-family:'Cormorant Garamond',serif;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--ink)}
img,svg{display:block;max-width:100%}
a{color:var(--pink-deep)}
.hidden{display:none !important}

#welcome{position:fixed;inset:0;z-index:60;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 22px;color:#fff;background:
  radial-gradient(700px 380px at 50% -5%,rgba(212,175,122,.28),transparent 65%),
  radial-gradient(520px 420px at 88% 108%,rgba(240,90,168,.35),transparent 60%),
  linear-gradient(165deg,#2A0009 0%,#4A0A24 55%,#330010 100%)}
#welcome.gone{display:none}
#welcome .glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 50% 20%,rgba(239,217,180,.16),transparent 70%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
#welcome .emblem{width:104px;height:104px;margin-bottom:18px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(240,90,168,.45))}
#welcome .kicker{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-light);margin-bottom:10px}
#welcome h1{font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:.05em;font-weight:600}
#welcome h1 span{color:var(--hot)}
#welcome .tagline{margin-top:10px;font-size:1.02rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-light)}
#welcome .motto{margin-top:14px;color:var(--blush);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;max-width:420px}
#welcome .feats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px;margin-top:22px}
#welcome .feats span{font-size:.75rem;letter-spacing:.05em;color:var(--gold-light);border:1px solid rgba(212,175,122,.45);border-radius:999px;padding:6px 13px;background:rgba(0,0,0,.22)}
#welcome .actions{display:flex;flex-direction:column;gap:12px;margin-top:30px;width:min(320px,100%)}
#welcome .foot{margin-top:22px;color:rgba(255,255,255,.72);font-size:.83rem;max-width:400px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:1rem;padding:13px 22px;border-radius:999px;transition:transform .15s ease,box-shadow .15s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#C9A45C);color:#2A1A08;box-shadow:0 10px 26px rgba(212,175,122,.4)}
.btn-pink{background:linear-gradient(135deg,var(--hot),var(--pink-deep));color:#fff;box-shadow:0 10px 26px rgba(226,68,154,.38)}
.btn-ghost{background:transparent;border:1.5px solid rgba(239,217,180,.55);color:#fff}
.btn-ghost.dark{border-color:rgba(194,43,126,.4);color:var(--pink-deep)}
.btn-sm{padding:8px 16px;font-size:.88rem}
.btn[disabled]{opacity:.55;pointer-events:none}

#app{display:none;min-height:100vh}
#app.on{display:block}
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,#2A0009,#4A0A24);color:#fff;padding:14px 18px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(42,0,9,.25)}
.topbar .logo{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.3);object-fit:cover}
.topbar .tt{flex:1;min-width:0}
.topbar .tt b{font-family:'Cormorant Garamond',serif;font-size:1.12rem;font-weight:600;letter-spacing:.04em;display:block;line-height:1.1}
.topbar .tt small{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-light)}
.badge-owner{font-size:.62rem;font-weight:700;letter-spacing:.12em;background:linear-gradient(135deg,var(--gold),#C9A45C);color:#2A1A08;border-radius:999px;padding:4px 10px;text-transform:uppercase}

main{max-width:720px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.view-head{margin:6px 0 16px}
.eyebrow{font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--pink-deep);font-weight:600}
.view-head h2{font-size:1.9rem;color:var(--night);margin-top:2px}
.view-head p{color:var(--muted);margin-top:4px}

.card{background:#fff;border:1px solid rgba(196,139,159,.22);border-radius:var(--radius);padding:18px;box-shadow:0 4px 18px rgba(158,95,121,.08);margin-bottom:14px}
.card h3{font-size:1.25rem;color:var(--night)}
.hint{font-size:.85rem;color:var(--muted)}
.err{color:var(--err);font-size:.88rem;margin-top:6px;min-height:1em}
.ok{color:var(--ok)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

label{display:block;font-size:.82rem;font-weight:600;letter-spacing:.04em;color:var(--night);margin:12px 0 5px}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border:1.5px solid rgba(196,139,159,.4);border-radius:13px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(226,68,154,.12)}
textarea.input{resize:vertical;min-height:74px}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:linear-gradient(160deg,#fff,var(--blush));border:1px solid rgba(196,139,159,.25);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.7rem;color:var(--pink-deep);line-height:1}
.stat span{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.typegrid{grid-template-columns:1fr}}
.typecard{position:relative;text-align:left;background:#fff;border:1.5px solid rgba(196,139,159,.28);border-radius:18px;padding:16px;transition:border .15s,transform .15s,box-shadow .15s}
.typecard:active{transform:scale(.98)}
.typecard.sel{border-color:var(--pink);box-shadow:0 8px 24px rgba(226,68,154,.18)}
.typecard .tico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blush),#fff);border:1px solid rgba(196,139,159,.3);margin-bottom:10px;color:var(--pink-deep)}
.typecard b{display:block;font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--night);line-height:1.2}
.typecard small{color:var(--muted);font-size:.8rem;display:block;margin-top:3px}

.adcard{border-radius:20px;overflow:hidden;box-shadow:0 14px 40px rgba(42,0,9,.16);border:1px solid rgba(196,139,159,.3);margin-bottom:14px}
.adcard .adhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(135deg,#2A0009,#4A0A24);color:#fff}
.adcard .adhead img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold)}
.adcard .adhead b{font-family:'Cormorant Garamond',serif;font-size:1.02rem;display:block;line-height:1.1}
.adcard .adhead small{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-light)}
.adcard .adhead .adtag{margin-left:auto;font-size:.6rem;font-weight:700;letter-spacing:.14em;background:rgba(240,90,168,.25);border:1px solid rgba(240,90,168,.6);color:#FFD7EC;border-radius:999px;padding:3px 9px;text-transform:uppercase}
.adcard .adbody{padding:18px 16px;background:linear-gradient(170deg,#fff,var(--cream))}
.adcard .adhl{font-family:'Cormorant Garamond',serif;font-size:1.45rem;color:var(--night);line-height:1.2}
.adcard .adtx{margin-top:8px;color:#4A2B3A;font-size:.95rem;white-space:pre-wrap}
.adcard .adtags{margin-top:10px;color:var(--pink-deep);font-size:.83rem;font-weight:500}
.adcard .adcta{display:inline-block;margin-top:14px;background:linear-gradient(135deg,var(--hot),var(--pink-deep));color:#fff;font-weight:600;font-size:.9rem;padding:10px 20px;border-radius:999px;box-shadow:0 8px 20px rgba(226,68,154,.35)}
.adcard .adfoot{padding:10px 16px;background:#fff;border-top:1px solid rgba(196,139,159,.2);font-size:.72rem;color:var(--muted);letter-spacing:.06em}

.sec{background:#fff;border:1px solid rgba(196,139,159,.25);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.sec .sl{font-size:.66rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--pink-deep)}
.sec .sv{margin-top:4px;white-space:pre-wrap}
.sec .copy{float:right;font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--pink-deep);border:1.5px solid rgba(194,43,126,.4);border-radius:999px;padding:4px 12px;text-transform:uppercase;background:var(--blush)}
.sec .copy:active{transform:scale(.95)}

.saved{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid rgba(196,139,159,.25);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.saved .si{width:38px;height:38px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--blush);color:var(--pink-deep)}
.saved b{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--night);display:block;line-height:1.2}
.saved small{color:var(--muted);font-size:.76rem}
.saved .sact{margin-left:auto;display:flex;gap:6px;flex:none}

.meter{height:8px;border-radius:999px;background:var(--blush);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--hot),var(--gold));transition:width .4s ease}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:space-around;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid rgba(196,139,159,.3);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--pink-deep)}
.nav button.on svg{filter:drop-shadow(0 3px 6px rgba(226,68,154,.4))}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--night);color:#fff;font-size:.9rem;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:70;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.spin{width:46px;height:46px;margin:26px auto;border-radius:50%;border:3.5px solid var(--blush);border-top-color:var(--pink);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gen-state{text-align:center;padding:10px 0 4px}
.gen-state p{color:var(--muted);font-size:.9rem;font-style:italic}

.tip{background:linear-gradient(135deg,#2A0009,#4A0A24);color:var(--blush);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.tip .tl{font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-light)}
.tip p{font-family:'Cormorant Garamond',serif;font-size:1.12rem;font-style:italic;margin-top:6px;line-height:1.4}

.vidstudio h3{display:flex;align-items:center;gap:8px}
.vrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vopt{flex:1;min-width:110px;text-align:center;font-size:.85rem;font-weight:600;padding:10px 8px;border-radius:12px;border:1.5px solid rgba(196,139,159,.4);background:#fff;color:var(--night)}
.vopt.sel{border-color:var(--pink);background:var(--blush);color:var(--pink-deep)}
.vtoggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.9rem;color:var(--night)}
.vtoggle input{width:20px;height:20px;accent-color:var(--pink-deep)}
.vstage{margin-top:14px;border-radius:16px;overflow:hidden;border:1px solid rgba(196,139,159,.3);background:#1A0008;display:none}
.vstage.on{display:block}
.vstage canvas,.vstage video{width:100%;display:block}
.vstatus{margin-top:10px;font-size:.88rem;color:var(--muted);min-height:1.3em}
.vnote{margin-top:10px;font-size:.78rem;color:var(--muted);background:var(--cream);border-radius:12px;padding:10px 12px}
.slide{background:var(--cream);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.slide-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slide-num{font-weight:600;font-size:.85rem;color:var(--ink);flex:1}
.sbtn{background:var(--blush);border:none;border-radius:8px;padding:4px 10px;font-size:.85rem;cursor:pointer;color:var(--ink)}
.sbtn:disabled{opacity:.4}
.sbtn.danger{background:#f7d6e3}
#slideEditor{margin-top:10px}
#slidePrev{width:140px;max-width:45%;border-radius:12px;display:block;margin:0 auto 10px;border:2px solid var(--gold)}
.slide-row{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.sdurl{font-size:.85rem;display:flex;align-items:center;gap:6px}
.sdur{width:70px}
</style>
</head>
<body>

<div id="welcome">
  <div class="glow"></div>
  <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="wg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F05AA8"/><stop offset="1" stop-color="#D4AF6A"/>
      </linearGradient>
    </defs>
    <circle cx="60" cy="60" r="54" fill="none" stroke="url(#wg)" stroke-width="2.5" opacity=".85"/>
    <path d="M30 72 L38 46 L48 68 L60 34 L72 68 L82 46 L90 72" fill="none" stroke="url(#wg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="76" width="64" height="7" rx="3.5" fill="url(#wg)"/>
    <circle cx="60" cy="22" r="4" fill="#EFD9B4"/>
    <path d="M96 34 l2.4 5 5 2.4 -5 2.4 -2.4 5 -2.4 -5 -5 -2.4 5 -2.4z" fill="#EFD9B4" opacity=".9"/>
    <path d="M22 88 l1.8 3.8 3.8 1.8 -3.8 1.8 -1.8 3.8 -1.8 -3.8 -3.8 -1.8 3.8 -1.8z" fill="#F05AA8" opacity=".8"/>
  </svg>
  <p class="kicker">Redeemed Warrior</p>
  <h1>AD <span>STUDIO</span></h1>
  <p class="tagline">Faith-Fueled Advertising</p>
  <p class="motto">Type in what you sell. Walk away with professional ads — in minutes.</p>
  <div class="feats">
    <span>Social Captions</span><span>Google Ads</span><span>Video Scripts</span><span>Slogans</span><span>Email Subjects</span><span>Product Descriptions</span>
  </div>
  <div class="actions">
    <button class="btn btn-gold" id="btnStart">Start Creating</button>
    <button class="btn btn-ghost" id="btnWelcomeAccount">Sign In</button>
  </div>
  <p class="foot">Redeemed by Grace. Strengthened by Purpose. Built to Rise.</p>
</div>

<div id="app">
  <header class="topbar">
    <img class="logo" src="../devotional-bible/cover-sm.jpg" onerror="this.onerror=null;this.src='https://apps.godsredeemedwarrior.org/apps/devotional-bible/cover-sm.jpg'" alt="" />
    <div class="tt"><b>Ad Studio</b><small>Redeemed Warrior</small></div>
    <span class="badge-owner hidden" id="ownerBadge">Owner</span>
  </header>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-create" class="view hidden"></section>
    <section id="view-ads" class="view hidden"></section>
    <section id="view-brand" class="view hidden"></section>
    <section id="view-account" class="view hidden"></section>
  </main>

  <nav class="nav" aria-label="Primary">
    <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Home</button>
    <button data-nav="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>Create</button>
    <button data-nav="ads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M8 15h8"/></svg>My Ads</button>
    <button data-nav="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Brand</button>
    <button data-nav="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Account</button>
  </nav>
</div>

<div id="toast" role="status"></div>

<script>
const API = (location.hostname === 'apps.godsredeemedwarrior.org' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'https://apps.godsredeemedwarrior.org';

const store = {
  get(k, d) { try { const v = localStorage.getItem('rwas_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rwas_' + k, JSON.stringify(v)); } catch {} }
};

const state = {
  view: 'home',
  auth: store.get('auth', null),
  profile: store.get('profile', { name:'', product:'', audience:'', tone:'Warm and encouraging', benefits:'', website:'', cta:'Shop now' }),
  ads: store.get('ads', []),
  create: { type: null, busy: false, result: null, error: '', lastForm: null, slides: null, slideSel: 0 }
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2600);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied to clipboard \u2713'); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard \u2713'); } catch { toast('Long-press the text to copy it.'); }
    ta.remove();
  }
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.auth && state.auth.token) headers['Authorization'] = 'Bearer ' + state.auth.token;
  const res = await fetch(API + path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || 'Something went wrong. Please try again.');
    err.status = res.status;
    throw err;
  }
  return data;
}

const ICONS = {

function buildPrompt(type, form) {
  return [
    'You are an elite advertising copywriter working for a small business owner with no marketing experience.',
    'Write world-class, ready-to-use advertising copy. Be specific, warm, and human \u2014 never generic filler.',
    'Honor the brand voice. Keep platform character limits when you know them (Google headlines max 30 characters, descriptions max 90).',
    '',
    'BUSINESS DETAILS:',
    brandBlock(),
    '',
    'REQUEST: ' + type.name + ' \u2014 ' + form.topic,
    '',
    'OUTPUT FORMAT \u2014 respond with ONLY these labeled sections, each label at the start of its own line exactly as written, followed by a colon and the content:',
    Object.values(type.markers).map(m => m + ': <content>').join('\n'),
    '',
    'Do not add any other sections, introductions, or explanations.'
  ].join('\n');
}

function parseSections(text, markers) {
  const out = {};
  const keys = Object.keys(markers);
  const labels = keys.map(k => markers[k]);
  const labelAlt = labels.map(l => l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
  for (let i = 0; i < keys.length; i++) {
    const lab = labels[i].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(?:^|\\n)[^\\S\\n]*(?:\\*\\*)?' + lab + '(?:\\*\\*)?\\s*:?\\s*\\**\\s*:?[ \\t]*(.+?)(?=\\n[^\\S\\n]*(?:\\*\\*)?(?:' + labelAlt + ')(?:\\*\\*)?\\s*:?|$)', 's');
    const m = text.match(re);
    out[keys[i]] = m ? m[1].trim().replace(/^#{1,3}\s+/, '').replace(/\*\*/g, '').trim() : '';
  }
  return out;
}

async function generate(t, form) {
  state.create.busy = true;
  state.create.lastForm = form;
  renderCreate();
  try {
    const data = await api('/api/chat', { method: 'POST', body: { message: buildPrompt(t, form) } });
    const reply = (data && data.reply) || '';
    const parsed = parseSections(reply, t.markers);
    if (!Object.values(parsed).filter(Boolean).length) parsed._raw = reply.trim();
    state.create.result = parsed;
    state.create.slides = null; state.create.slideSel = 0;
    state.create.busy = false;
    renderCreate();
  } catch (e) {
    state.create.busy = false;
    state.create.result = null;
    state.create.error = e.status === 429
      ? 'The AI is resting for a moment (free-tier limit). Wait a minute and try again.'
      : (e.message || 'Could not reach the AI. Check your connection and try again.');
    renderCreate();
  }
}

    el.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => navTo(b.dataset.nav)));

          <small>${esc(((a.topic || '').slice(0, 60)) + ((a.topic || '').length > 60 ? '\u2026' : ''))}</small>

        </div>
      </div>`).join('')}
    <button class="btn btn-pink" style="width:100%;margin-top:6px" data-nav="create">Create another ad</button>`;
  el.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => navTo(b.dataset.nav)));
  el.querySelectorAll('[data-copy-ad]').forEach(b => b.addEventListener('click', () => {
    const a = state.ads.find(x => String(x.id) === b.dataset.copyAd);
    if (a) copyText(flattenAd(a));
  }));
  el.querySelectorAll('[data-del-ad]').forEach(b => b.addEventListener('click', () => {

    toast('Ad deleted');
  }));

function flattenAd(a) {
  const t = ADTYPES.find(x => x.id === a.type);
  const keys = t ? Object.keys(t.markers) : Object.keys(a.sections || {});
  return keys.map(k => a.sections && a.sections[k] ? (SECTION_LABELS[k] || k) + ':\n' + a.sections[k] : '').filter(Boolean).join('\n\n') || (a.sections && a.sections._raw) || '';
}

function brandPct() {
  const filled = Object.values(state.profile).filter(v => String(v || '').trim()).length;
  return Math.round(filled / 7 * 100);
}

function updateOwnerBadge() {
  document.getElementById('ownerBadge').classList.toggle('hidden', !isOwner());
}

async function verifyRole() {
  if (!state.auth) return;
  try {
    const me = await api('/api/auth/me');
    const role = me && me.member && me.member.role;
    if (role && role !== state.auth.role) { state.auth.role = role; store.set('auth', state.auth); }
  } catch (e) {
    if (e.status === 401) { state.auth = null; store.set('auth', null); }
  }
  updateOwnerBadge();
}

function buildScenes(t, r) {
  if (t.id === 'video') {
    return [
      { label: 'HOOK', text: r.hook },
      { label: 'SCENE 1', text: r.sc1 },
      { label: 'SCENE 2', text: r.sc2 },
      { label: 'SCENE 3', text: r.sc3 },
      { label: 'CALL TO ACTION', text: r.cta, cta: true }
    ].filter(s => s.text);
  }
  return [
    { label: 'INTRODUCING', text: r.hl || r.title || '' },
    { label: '', text: r.caption || r.short || '' },
    { label: 'CALL TO ACTION', text: r.cta, cta: true }
  ].filter(s => s.text);
}

function sceneDuration(s, i, total) {
  if (s.cta) return 4;
  return Math.min(6, Math.max(3.2, 1.6 + s.text.length * 0.045)) ;
}

function wrapCanvasText(ctx, text, maxW) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

const VIDEO_FADE = 0.6;

function sparkleStar(ctx, x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

function drawSceneBackground(ctx, W, H, idx, local, dur, now) {
  const p = Math.min(1, local / Math.max(0.001, dur));
  const z = 1 + 0.08 * p;
  const panX = Math.sin(idx * 2.3) * W * 0.022 * p;
  const panY = Math.cos(idx * 1.7) * H * 0.014 * p;
  ctx.save();
  ctx.translate(W / 2 + panX, H / 2 + panY);
  ctx.scale(z, z);
  ctx.translate(-W / 2, -H / 2);
  const g = ctx.createLinearGradient(0, 0, W, H);
  if (idx % 2 === 0) { g.addColorStop(0, '#2A0009'); g.addColorStop(0.55, '#4A0A24'); g.addColorStop(1, '#330010'); }
  else { g.addColorStop(0, '#330010'); g.addColorStop(0.5, '#5C0F33'); g.addColorStop(1, '#2A0009'); }
  ctx.fillStyle = g;
  ctx.fillRect(-W * 0.1, -H * 0.1, W * 1.2, H * 1.2);
  const gx = W / 2 + Math.sin(now * 0.35 + idx) * W * 0.06;
  const gy = H * 0.32 + Math.cos(now * 0.28 + idx) * H * 0.02;
  const glow = ctx.createRadialGradient(gx, gy, 10, gx, gy, W * 0.8);
  const pulse = 0.16 + 0.07 * Math.sin(now * 1.4);
  glow.addColorStop(0, 'rgba(239,217,180,' + pulse + ')');
  glow.addColorStop(1, 'rgba(239,217,180,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(-W * 0.1, -H * 0.1, W * 1.2, H * 1.2);
  for (let i = 0; i < 14; i++) {
    const seed = ((idx * 97 + i * 131) % 1000) / 1000;
    const bx = W * (0.08 + 0.84 * ((seed * 7.13 + idx * 0.37) % 1));
    const by = H * (0.1 + 0.78 * ((seed * 3.71 + i * 0.11) % 1));
    const dx = Math.sin(now * 0.5 + seed * 6.28) * W * 0.016;
    const dy = Math.cos(now * 0.38 + seed * 6.28) * H * 0.012;
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(now * (1.1 + seed * 1.4) + seed * 6.28));
    const size = W * (0.004 + 0.006 * seed);
    ctx.fillStyle = 'rgba(' + (seed > 0.55 ? '239,217,180' : '240,90,168') + ',' + (0.75 * tw).toFixed(3) + ')';
    sparkleStar(ctx, bx + dx, by + dy, size);
  }
  ctx.restore();
}

function drawSceneContent(ctx, W, H, s, local, now) {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const appear = Math.min(1, local / 0.6);
  const ease = 1 - Math.pow(1 - appear, 3);
  if (s.label) {
    const lSize = Math.round(W * 0.032);
    ctx.font = '700 ' + lSize + 'px Jost, sans-serif';
    ctx.fillStyle = 'rgba(240,90,168,' + (0.95 * ease).toFixed(3) + ')';
    ctx.fillText(s.label.split('').join('\u2009'), W / 2, H * (s.cta ? 0.32 : 0.24));
  }
  const mainSize = Math.round(W * (s.cta ? 0.082 : 0.062));
  ctx.font = '600 ' + mainSize + 'px "Cormorant Garamond", serif';
  const lines = wrapCanvasText(ctx, s.text, W * 0.78);
  const lineH = mainSize * 1.25;
  const blockH = lines.length * lineH;
  const cy = H * (s.cta ? 0.5 : 0.46) - blockH / 2 + lineH / 2;
  ctx.shadowColor = 'rgba(0,0,0,.45)';
  ctx.shadowBlur = W * 0.012;
  lines.forEach((ln, i) => {
    const la = Math.min(1, Math.max(0, (local - 0.15 - i * 0.18) / 0.55));
    const le = 1 - Math.pow(1 - la, 3);
    const y = cy + i * lineH + (1 - le) * H * 0.035;
    ctx.fillStyle = 'rgba(251,246,238,' + (0.98 * le).toFixed(3) + ')';
    ctx.fillText(ln, W / 2, y);
  });
  ctx.shadowBlur = 0;
  if (s.cta) {
    const pulse = 1 + 0.03 * Math.sin(now * 3.2);
    const bw = W * 0.5 * pulse, bh = H * 0.062 * pulse;
    const bx = W / 2 - bw / 2, by = H * 0.66 - (bh - H * 0.062) / 2;
    const cg = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
    cg.addColorStop(0, '#F05AA8'); cg.addColorStop(1, '#C22B7E');
    const r = bh / 2;
    const buttonPath = () => {
      ctx.beginPath();
      ctx.moveTo(bx + r, by);
      ctx.arcTo(bx + bw, by, bx + bw, by + bh, r);
      ctx.arcTo(bx + bw, by + bh, bx, by + bh, r);
      ctx.arcTo(bx, by + bh, bx, by, r);
      ctx.arcTo(bx, by, bx + bw, by, r);
      ctx.closePath();
    };
    ctx.save();
    ctx.globalAlpha *= ease;
    ctx.fillStyle = cg;
    buttonPath();
    ctx.fill();
    buttonPath();
    ctx.clip();
    const shX = bx + ((now * W * 0.9) % (bw * 1.6)) - bw * 0.3;
    const sh = ctx.createLinearGradient(shX - W * 0.06, 0, shX + W * 0.06, 0);
    sh.addColorStop(0, 'rgba(255,255,255,0)');
    sh.addColorStop(0.5, 'rgba(255,255,255,.35)');
    sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh;
    ctx.fillRect(bx, by, bw, bh);
    ctx.restore();
    ctx.font = '600 ' + Math.round(W * 0.036) + 'px Jost, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,' + ease.toFixed(3) + ')';
    ctx.fillText(s.text.toUpperCase(), W / 2, by + bh / 2);
    ctx.font = 'italic 500 ' + Math.round(W * 0.03) + 'px "Cormorant Garamond", serif';
    ctx.fillStyle = 'rgba(239,217,180,.9)';
    ctx.fillText('Redeemed by Grace. Built to Rise.', W / 2, by + bh + H * 0.045);
  }
}

function drawVideoChrome(ctx, W, H, brand) {
  ctx.strokeStyle = 'rgba(212,175,122,.5)';
  ctx.lineWidth = Math.max(2, W * 0.004);
  ctx.strokeRect(W * 0.045, H * 0.035, W * 0.91, H * 0.93);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const wmSize = Math.round(W * 0.030);
  ctx.font = '600 ' + wmSize + 'px Jost, sans-serif';
  ctx.fillStyle = 'rgba(239,217,180,.85)';
  const wm = (brand || 'REDEEMED WARRIOR').toUpperCase().split('').join('\u2009');
  ctx.fillText(wm, W / 2, H * 0.085);
  ctx.fillStyle = 'rgba(212,175,122,.9)';
  ctx.fillRect(W / 2 - W * 0.05, H * 0.115, W * 0.1, Math.max(1.5, H * 0.002));
}

function drawVignette(ctx, W, H) {
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(10,0,4,.4)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

function drawProgressBar(ctx, W, H, t, total, now) {
  const pbW = W * 0.7, pbH = Math.max(3, H * 0.004);
  const pbX = W / 2 - pbW / 2, pbY = H * 0.915;
  ctx.fillStyle = 'rgba(251,246,238,.18)';
  ctx.fillRect(pbX, pbY, pbW, pbH);
  const pg = ctx.createLinearGradient(pbX, 0, pbX + pbW, 0);
  pg.addColorStop(0, '#F05AA8'); pg.addColorStop(1, '#D4AF6A');
  ctx.fillStyle = pg;
  ctx.fillRect(pbX, pbY, pbW * Math.min(1, t / total), pbH);
  ctx.save();
  ctx.beginPath();
  ctx.rect(pbX, pbY, pbW * Math.min(1, t / total), pbH);
  ctx.clip();
  const hx = pbX + ((now * pbW * 0.6) % (pbW * 1.4)) - pbW * 0.2;
  const hg = ctx.createLinearGradient(hx - pbW * 0.08, 0, hx + pbW * 0.08, 0);
  hg.addColorStop(0, 'rgba(255,255,255,0)');
  hg.addColorStop(0.5, 'rgba(255,255,255,.5)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(pbX, pbY, pbW, pbH);
  ctx.restore();
}

function drawVideoFrame(ctx, W, H, scenes, times, now, brand) {
  const total = times[times.length - 1];
  const t = Math.min(now, total - 0.001);
  let idx = 0;
  while (idx < times.length - 2 && t >= times[idx + 1]) idx++;
  const s = scenes[idx];
  const local = t - times[idx];
  const dur = times[idx + 1] - times[idx];
  const inFade = idx < scenes.length - 1 && dur - local < VIDEO_FADE;
  drawSceneBackground(ctx, W, H, idx, local, dur, now);
  if (inFade) {
    ctx.globalAlpha = Math.min(1, (local - (dur - VIDEO_FADE)) / VIDEO_FADE);
    drawSceneBackground(ctx, W, H, idx + 1, local - (dur - VIDEO_FADE), VIDEO_FADE, now);
    ctx.globalAlpha = 1;
  }
  drawVideoChrome(ctx, W, H, brand);
  drawSceneContent(ctx, W, H, s, idx === 0 ? local : local + VIDEO_FADE, now);
  if (inFade) {
    ctx.globalAlpha = Math.min(1, (local - (dur - VIDEO_FADE)) / VIDEO_FADE);
    drawSceneContent(ctx, W, H, scenes[idx + 1], local - dur + VIDEO_FADE, now);
    ctx.globalAlpha = 1;
  }
  drawVignette(ctx, W, H);
  drawProgressBar(ctx, W, H, t, total, now);
}

function startMusicBed(audioCtx, dest, totalSeconds) {
  const master = audioCtx.createGain();
  master.gain.value = 0.0001;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1400;
  master.connect(filter);
  filter.connect(dest);
  const chords = [
    [220.0, 277.18, 329.63],
    [196.0, 246.94, 293.66],
    [174.61, 220.0, 261.63],
    [196.0, 246.94, 329.63]
  ];
  const chordLen = totalSeconds / chords.length;
  const now = audioCtx.currentTime;
  chords.forEach((freqs, ci) => {
    const t0 = now + ci * chordLen;
    freqs.forEach(f => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.05, t0 + 0.8);
      g.gain.setValueAtTime(0.05, t0 + chordLen - 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t0 + chordLen);
      osc.connect(g);
      g.connect(master);
      osc.start(t0);
      osc.stop(t0 + chordLen + 0.05);
    });
    const arpFreqs = [freqs[2] * 2, freqs[1] * 2, freqs[2] * 2, freqs[0] * 4];
    const steps = 8;
    const stepLen = chordLen / steps;
    for (let st = 0; st < steps; st++) {
      const at = t0 + st * stepLen;
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = arpFreqs[st % arpFreqs.length];
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.028, at + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, at + Math.min(stepLen * 1.8, 0.9));
      osc.connect(g);
      g.connect(master);
      osc.start(at);
      osc.stop(at + 1);
    }
  });
  master.gain.setValueAtTime(0.0001, now);
  master.gain.linearRampToValueAtTime(1.0, now + 0.5);
  master.gain.setValueAtTime(1.0, now + totalSeconds - 0.7);
  master.gain.linearRampToValueAtTime(0.0001, now + totalSeconds);
}

function slideBase(t, r) {
  return buildScenes(t, r).map(s => ({ label: s.label || '', text: s.text, cta: !!s.cta, dur: Math.round(sceneDuration(s, 0, 1) * 10) / 10 }));
}

function drawSlidePreview() {
  const cv = document.getElementById('slidePrev');
  if (!cv) return;
  const slides = state.create.slides || [];
  const idx = Math.min(state.create.slideSel || 0, slides.length - 1);
  const s = slides[idx];
  if (!s) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const now = performance.now() / 1000;
  drawSceneBackground(ctx, W, H, idx, 1, 1, now);
  drawSceneContent(ctx, W, H, s, 2, now);
  drawVideoChrome(ctx, W, H, (state.profile && state.profile.name) || 'REDEEMED WARRIOR');
  drawVignette(ctx, W, H);
}

function renderSlideEditor(t, r) {
  const ed = document.getElementById('slideEditor');
  if (!ed) return;
  const editBtn = document.querySelector('#vidStudio [data-scenes="edit"]');
  if (!editBtn || !editBtn.classList.contains('sel')) { ed.classList.add('hidden'); ed.innerHTML = ''; return; }
  if (!Array.isArray(state.create.slides) || !state.create.slides.length) state.create.slides = slideBase(t, r);
  if (state.create.slideSel >= state.create.slides.length) state.create.slideSel = 0;
  ed.classList.remove('hidden');
  const last = state.create.slides.length - 1;
  ed.innerHTML = '<canvas id="slidePrev" width="216" height="384"></canvas>' +
    state.create.slides.map((s, i) => `
    <div class="slide" data-i="${i}">
      <div class="slide-top"><span class="slide-num">Slide ${i + 1}</span>
        <button class="sbtn" data-mv="-1" ${i === 0 ? 'disabled' : ''}>&#9650;</button>
        <button class="sbtn" data-mv="1" ${i === last ? 'disabled' : ''}>&#9660;</button>
        <button class="sbtn danger" data-del ${state.create.slides.length <= 1 ? 'disabled' : ''}>&#10005;</button>
      </div>
      <input class="input" data-f="label" placeholder="Small label, like HOOK" value="${esc(s.label)}" />
      <textarea class="input" data-f="text" rows="2" placeholder="The words on this slide">${esc(s.text)}</textarea>
      <div class="slide-row">
        <label class="sdurl">Seconds <input class="input sdur" data-f="dur" type="number" min="1.5" max="10" step="0.5" value="${s.dur}" /></label>
        <label class="vtoggle"><input type="checkbox" data-f="cta" ${s.cta ? 'checked' : ''} /> Big button slide</label>
      </div>
    </div>`).join('') +
    '<button class="btn btn-ghost dark btn-sm" id="btnAddSlide">+ Add Slide</button>';
  ed.querySelectorAll('.slide').forEach(sl => {
    const i = Number(sl.dataset.i);
    sl.addEventListener('click', () => { state.create.slideSel = i; drawSlidePreview(); });
    sl.querySelectorAll('[data-f]').forEach(inp => {
      const apply = () => {
        const s = state.create.slides[i];
        if (!s) return;
        if (inp.dataset.f === 'cta') s.cta = inp.checked;
        else if (inp.dataset.f === 'dur') s.dur = Number(inp.value) || 3;
        else s[inp.dataset.f] = inp.value;
        state.create.slideSel = i;
        drawSlidePreview();
      };
      inp.addEventListener(inp.type === 'checkbox' || inp.type === 'number' ? 'change' : 'input', apply);
    });
    sl.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const j = i + Number(b.dataset.mv);
      if (j < 0 || j >= state.create.slides.length) return;
      const arr = state.create.slides;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      state.create.slideSel = j;
      renderSlideEditor(t, r);
    }));
    const delBtn = sl.querySelector('[data-del]');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.create.slides.length <= 1) return;
      state.create.slides.splice(i, 1);
      state.create.slideSel = Math.max(0, i - 1);
      renderSlideEditor(t, r);
    });
  });
  ed.querySelector('#btnAddSlide').addEventListener('click', () => {
    state.create.slides.push({ label: '', text: '', cta: false, dur: 4 });
    state.create.slideSel = state.create.slides.length - 1;
    renderSlideEditor(t, r);
  });
  drawSlidePreview();
}

async function makeVideoAd(t, r) {
  const studio = document.getElementById('vidStudio');
  const status = document.getElementById('vstatus');
  const stage = document.getElementById('vstage');
  const canvas = document.getElementById('vcanvas');
  const video = document.getElementById('vvideo');
  const dl = document.getElementById('vdownload');
  const aspect = studio.querySelector('[data-aspect].sel').dataset.aspect;
  const withMusic = document.getElementById('vidMusic').checked;
  const voiceOpt = studio.querySelector('[data-voice].sel');
  const voice = voiceOpt ? voiceOpt.dataset.voice : 'none';
  const aiVoiceReady = voice === 'ai' && window.speechSynthesis && window.SpeechSynthesisUtterance;
  const editBtn = studio.querySelector('[data-scenes="edit"]');
  const editOn = editBtn && editBtn.classList.contains('sel');
  const custom = (editOn && Array.isArray(state.create.slides) && state.create.slides.length)
    ? state.create.slides.filter(s => s.text && s.text.trim()).map(s => ({ label: s.label || '', text: s.text.trim(), cta: !!s.cta, dur: Number(s.dur) || 0 }))
    : null;
  const scenes = custom || buildScenes(t, r);
  if (!scenes.length) { status.textContent = 'Generate the script first, then make the video.'; return; }
  const W = 1080;
  const H = aspect === 'square' ? 1080 : 1920;
  canvas.width = W; canvas.height = H;
  video.classList.add('hidden');
  dl.classList.add('hidden');
  stage.classList.add('on');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const brand = (state.profile && state.profile.name) || 'REDEEMED WARRIOR';
  status.textContent = 'Preparing your brand scenes\u2026';
  try { if (document.fonts && document.fonts.load) { await document.fonts.load('600 60px "Cormorant Garamond"'); await document.fonts.load('600 30px Jost'); } } catch {}
  const times = [0];
  scenes.forEach((s, i) => times.push(times[i] + (s.dur ? Math.min(10, Math.max(1.5, s.dur)) : sceneDuration(s, i, scenes.length))));
  const total = times[times.length - 1];
  const canRecord = typeof MediaRecorder !== 'undefined' && canvas.captureStream;
  let recorder = null, chunks = [], audioCtx = null, micStream = null;
  const streams = [];
  if (canRecord) {
    const stream = canvas.captureStream(30);
    streams.push(stream);
    if (withMusic && window.AudioContext) {
      try {
        audioCtx = new AudioContext();
        const dest = audioCtx.createMediaStreamDestination();
        startMusicBed(audioCtx, dest, total);
        dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
      } catch (e) { audioCtx = null; }
    }
    if (voice === 'mic' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
        micStream.getAudioTracks().forEach(tr => stream.addTrack(tr));
      } catch (e) { micStream = null; }
    }
    const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
    const recOpts = mime ? { mimeType: mime, videoBitsPerSecond: 10000000, audioBitsPerSecond: 128000 } : { videoBitsPerSecond: 10000000, audioBitsPerSecond: 128000 };
    recorder = new MediaRecorder(stream, recOpts);
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  }
  status.textContent = canRecord ? 'Recording your video ad\u2026' : 'Playing your video ad\u2026';
  if (voice === 'mic' && !micStream) status.textContent = 'Microphone not available \u2014 recording without voice.';
  if (voice === 'ai' && !aiVoiceReady) status.textContent = 'AI voice is not supported in this browser \u2014 playing without voice.';
  const recStart = performance.now();
  let rafId = null;
  const finish = () => {
    cancelAnimationFrame(rafId);
    if (audioCtx) { try { audioCtx.close(); } catch {} }
    if (micStream) { try { micStream.getTracks().forEach(tr => tr.stop()); } catch {} }
    if (aiVoiceReady) { try { window.speechSynthesis.cancel(); } catch {} }
    if (recorder && recorder.state !== 'inactive') {
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: (recorder.mimeType || 'video/webm').split(';')[0] });
        const url = URL.createObjectURL(blob);
        canvas.style.display = 'none';
        video.src = url;
        video.classList.remove('hidden');
        dl.href = url;
        dl.download = 'redeemed-warrior-video-ad.' + (blob.type.includes('mp4') ? 'mp4' : 'webm');
        dl.classList.remove('hidden');
        status.textContent = 'Your video ad is ready! Watch it below, then tap Download and post it.';
        toast('Video ad created \u2713');
      };
      recorder.stop();
    } else {
      status.textContent = 'Your browser cannot save video files. Watch the live version above \u2014 or screenshot the scenes and post those.';
    }
  };
  const speakScene = (i) => {
    if (!aiVoiceReady) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(scenes[i].text);
      u.rate = 0.95;
      u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch {}
  };
  const sceneIndexAt = (tt) => { let i = 0; while (i < times.length - 2 && tt >= times[i + 1]) i++; return i; };
  let spokenIdx = -1;
  if (voice === 'mic' && micStream) {
    for (let c = 3; c > 0; c--) {
      status.textContent = 'Get ready \u2014 recording in ' + c + '\u2026';
      drawVideoFrame(ctx, W, H, scenes, times, 0, brand);
      ctx.save();
      ctx.font = '700 ' + Math.round(W * 0.22) + 'px "Cormorant Garamond", serif';
      ctx.fillStyle = 'rgba(240,90,168,.92)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.5)';
      ctx.shadowBlur = W * 0.03;
      ctx.fillText(String(c), W / 2, H / 2);
      ctx.restore();
      await new Promise(res => setTimeout(res, 750));
    }
    status.textContent = 'Recording \u2014 speak your script now!';
  }
  if (recorder) recorder.start(250);
  const loop = () => {
    const now = (performance.now() - recStart) / 1000;
    drawVideoFrame(ctx, W, H, scenes, times, now, brand);
    const si = sceneIndexAt(Math.min(now, total - 0.001));
    if (si !== spokenIdx) { spokenIdx = si; speakScene(si); }
    if (now >= total) { finish(); return; }
    rafId = requestAnimationFrame(loop);
  };
  loop();
}

document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('welcome').classList.add('gone');
  document.getElementById('app').classList.add('on');
  navTo('home');
});
document.getElementById('btnWelcomeAccount').addEventListener('click', () => {
  document.getElementById('welcome').classList.add('gone');
  document.getElementById('app').classList.add('on');
  navTo('account');
});

if (state.auth) {
  document.getElementById('welcome').classList.add('gone');
  document.getElementById('app').classList.add('on');
  navTo('home');
  verifyRole();
}
