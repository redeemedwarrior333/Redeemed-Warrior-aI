services:
  - type: web
    name: redeemed-warrior-ai-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: API_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_FALLBACK_BASE_URL
        sync: false
      - key: AI_FALLBACK_API_KEY
        sync: false
      - key: AI_FALLBACK_MODEL
        sync: false
      - key: PUBLIC_CHAT_ENABLED
        value: "true"
      - key: PUBLIC_RATE_LIMIT_MAX
        value: "10"
      - key: RW_STORE_API_KEY
        sync: false
      - key: OWNER_EMAILS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RW_STORE_BASE_URL
        value: https://godsredeemedwarrior.store/.sfs-be
